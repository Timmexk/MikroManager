# Bouwt het Docker-image en zet het op ghcr.io/timmexk/mikromanager.
# - Push naar main: tag "edge" en "sha-<commit>".
# - Tag v1.2.3: tags "1.2.3", "1.2" en "latest".
# Voor amd64 (Unraid, de meeste servers) en arm64 (Raspberry Pi e.d.).
name: Docker-image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/docker.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/timmexk/mikromanager
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
