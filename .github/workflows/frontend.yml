# Bouwt de frontend en zet hem als download klaar, zodat install.sh op de server geen npm nodig heeft.
# - Bij elke push naar main die de frontend raakt: release "frontend-latest" wordt bijgewerkt.
# - Bij een tag v*: de frontend komt ook bij die release te staan.
name: Frontend bouwen

on:
  push:
    branches: [main]
    paths:
      - "v0.1/frontend/**"
      - "v0.2/frontend/**"
      - ".github/workflows/frontend.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1          # both versions upload to the same release
      matrix:
        include:
          - dir: v0.1
            asset: mikromanager-frontend      # name kept for existing v0.1 installs
          - dir: v0.2
            asset: mikromanager-frontend-v0.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/frontend/package-lock.json

      - name: Bouwen
        working-directory: ${{ matrix.dir }}/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Inpakken
        run: |
          tar --owner=0 --group=0 --mode='u+rwX,go+rX,go-w' \
              -czf ${{ matrix.asset }}.tar.gz -C ${{ matrix.dir }}/backend/static .
          sha256sum ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256

      - name: Publiceren als frontend-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view frontend-latest >/dev/null 2>&1 || \
            gh release create frontend-latest --title "Frontend (laatste build van main)" \
              --notes "Automatisch gebouwd. Wordt gebruikt door v0.1/linux/install.sh." --prerelease --target main
          git tag -f frontend-latest && git push -f origin frontend-latest
          gh release upload frontend-latest ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}.tar.gz.sha256 --clobber

      - name: Toevoegen aan versie-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}.tar.gz.sha256 --clobber
