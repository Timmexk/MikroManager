services:
  mikromanager:
    image: ghcr.io/timmexk/mikromanager:edge   # of: build: .   om het image zelf te bouwen
    container_name: mikromanager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /mnt/user/appdata/mikromanager:/data   # database, secret.key, back-ups
    environment:
      TZ: Europe/Amsterdam                     # the nightly back-up uses local time
      # MIKROMANAGER_DEMO: "1"                   # simulated routers, data wiped on every start
      # MIKROMANAGER_SECURE_COOKIE: "1"          # set when served over HTTPS (reverse proxy)
      # MIKROMANAGER_POLL: "15"                  # seconds between polls
