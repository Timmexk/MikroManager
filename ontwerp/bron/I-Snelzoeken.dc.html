    <div style="padding: 10px 16px 4px; font-size: 12px; font-weight: 500; color: #98a2af">Apparaten</div>

      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: #c4cbd4">192.168.88.11</span>
      <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 3px; border: 1px solid #3a424d; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #c4cbd4">Enter</span>

    </button>
    <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 16px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
      <span style="flex: 0 0 auto; width: 8px; height: 8px; background: #3fb97a" aria-hidden="true"></span>
      <span style="flex: 1; min-width: 0"><span style="font-weight: 500">tv-woonkamer</span> <span style="color: #98a2af">bedraad, hEX-PoE-zolder ether4</span></span>

    <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 16px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
      <span style="flex: 0 0 auto; width: 8px; height: 8px; background: #e0a52e" aria-hidden="true"></span>

    <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 16px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#98a2af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path></svg>

      <span>Zoekt ook op IP, MAC en vendor</span>
    </div>
  </section>
</div>
