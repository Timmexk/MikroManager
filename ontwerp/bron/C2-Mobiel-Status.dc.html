<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>MikroManager mobiel, status</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#6ea8fe}a:hover{color:#a9cbff}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 16px 14px 0; display: flex; flex-direction: column; gap: 12px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13.5px; line-height: 1.4; color: #e6e9ed; background: #0e1114">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <button type="button" aria-label="Site kiezen, nu Thuis" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px 0 8px; border-radius: 6px; border: 1px solid #242a32; background: #15191e; color: inherit; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
      <span style="width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; color: #0a0c0f; background: #3d8bfd">T</span>
      <span>Thuis</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98a2af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" aria-label="Zoeken" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 6px; border: 1px solid #242a32; background: #15191e; color: #c4cbd4; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>
      </button>
      <button type="button" aria-label="Meldingen, 2 nieuw" style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 6px; border: 1px solid #242a32; background: #15191e; color: #c4cbd4; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7 2.5 7h-17S6 15 6 9zM10 20a2.2 2.2 0 0 0 4 0"></path></svg>
        <span style="position: absolute; top: 7px; right: 7px; min-width: 14px; height: 14px; border-radius: 3px; font-size: 10.5px; font-weight: 600; line-height: 14px; text-align: center; color: #1a1300; background: #e0a52e">2</span>
      </button>
    </div>
  </div>

  <section style="border-radius: 6px; background: #15191e; border: 1px solid #242a32; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 38px; padding: 0 14px">
      <h2 style="margin: 0; font-size: 13.5px; font-weight: 600">WAN</h2>
      <span style="font-size: 12.5px; color: #98a2af">laatste failover 2 okt</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 4px 14px; border-top: 1px solid #1c2229">
      <span style="flex: 0 0 auto; width: 8px; height: 8px; background: #3fb97a" aria-hidden="true"></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-weight: 600">Kabel</span>
        <span style="font-size: 12.5px; color: #98a2af; font-variant-numeric: tabular-nums">38,0 Mbps down, 6,2 up</span>
      </span>
      <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 3px; font-size: 12.5px; font-weight: 500; color: #0b1f14; background: #3fb97a">Actief</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 4px 14px; border-top: 1px solid #1c2229">
      <span style="flex: 0 0 auto; box-sizing: border-box; width: 8px; height: 8px; border: 2px solid #98a2af" aria-hidden="true"></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-weight: 600">4G back-up</span>
        <span style="font-size: 12.5px; color: #98a2af">bereikbaar, geen verkeer</span>
      </span>
      <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 3px; font-size: 12.5px; font-weight: 500; color: #c4cbd4; border: 1px solid #3a424d">Stand-by</span>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: 6px; background: #15191e; border: 1px solid #242a32">
    <div style="padding: 9px 14px; border-right: 1px solid #242a32">
      <div style="font-size: 12.5px; color: #98a2af">Apparaten</div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums"><span style="width: 8px; height: 8px; background: #3fb97a"></span>5 van 5</div>
    </div>
    <div style="padding: 9px 14px">
      <div style="font-size: 12.5px; color: #98a2af">Clients</div>
      <div style="font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums">19 <span style="font-size: 12.5px; font-weight: 400; color: #98a2af">13 wifi</span></div>
    </div>
  </section>

  <section style="border-radius: 6px; background: #15191e; border: 1px solid #242a32; overflow: hidden">
    <div style="display: flex; align-items: center; height: 38px; padding: 0 14px">
      <h2 style="margin: 0; font-size: 13.5px; font-weight: 600">Aandacht</h2>
    </div>
    <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; min-height: 48px; padding: 4px 14px; border: 0; border-top: 1px solid #1c2229; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
      <span style="flex: 0 0 auto; width: 8px; height: 8px; background: #e0a52e" aria-hidden="true"></span>
      <span style="flex: 1; min-width: 0">RouterOS 7.20.2 voor 5 apparaten</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98a2af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; min-height: 48px; padding: 4px 14px; border: 0; border-top: 1px solid #1c2229; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
      <span style="flex: 0 0 auto; width: 8px; height: 8px; background: #e0a52e" aria-hidden="true"></span>
      <span style="flex: 1; min-width: 0">Firmware CRS310-kantoor loopt achter</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98a2af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </section>

  <section style="border-radius: 6px; background: #15191e; border: 1px solid #242a32; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 38px; padding: 0 14px">
      <h2 style="margin: 0; font-size: 13.5px; font-weight: 600">Apparaten</h2>
      <span style="font-size: 12.5px; color: #98a2af">CPU</span>
    </div>
    <sc-for list="{{devices}}" as="d" hint-placeholder-count="5">
      <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; height: 48px; padding: 0 14px; border: 0; border-top: 1px solid #1c2229; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
        <span style="flex: 0 0 auto; width: 8px; height: 8px; background: #3fb97a" aria-hidden="true"></span>
        <span style="flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.name}}</span>
        <span style="flex: 0 0 auto; display: inline-flex; gap: 2px" aria-hidden="true">
          <sc-for list="{{d.ports}}" as="p" hint-placeholder-count="5">
            <span style="width: 8px; height: 8px; background: {{p.c}}"></span>
          </sc-for>
        </span>
        <span style="flex: 0 0 34px; text-align: right; color: #c4cbd4; font-variant-numeric: tabular-nums">{{d.cpu}}</span>
      </button>
    </sc-for>
  </section>

  <nav aria-label="Hoofdmenu" style="position: absolute; left: 14px; right: 14px; bottom: 16px; height: 64px; box-sizing: border-box; padding: 5px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; border-radius: 12px; background: #1a1f25; border: 1px solid #333b45; box-shadow: 0 16px 36px rgba(0,0,0,0.6)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; padding: 0; border: 0; border-radius: 8px; font: inherit; font-size: 11px; font-weight: 500; cursor: pointer; color: {{t.color}}; background: {{t.bg}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.iconColor}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
      </button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const up = '#3fb97a', poe = '#e0a52e', wan = '#3d8bfd', off = '#333b45';
    const ports = (list) => list.map((c) => ({ c }));
    const active = 'Overzicht';
    const tabs = [
      { label: 'Overzicht', icon: 'M4 4h7v7H4zM13 4h7v4h-7zM13 12h7v8h-7zM4 15h7v5H4z' },
      { label: 'Apparaten', icon: 'M4 5h16v6H4zM4 13h16v6H4zM7.5 8h.01M7.5 16h.01' },
      { label: 'Clients', icon: 'M3 5h13v9H3zM7 18h5M9.5 14v4M18 9h3v10h-3z' },
      { label: 'Wifi', icon: 'M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01' },
      { label: 'Meer', icon: 'M5 12h.01M12 12h.01M19 12h.01M5 6h.01M12 6h.01M19 6h.01M5 18h.01M12 18h.01M19 18h.01' },
    ];
    return {
      tabs: tabs.map((t) => ({
        ...t,
        color: t.label === active ? '#ffffff' : '#98a2af',
        iconColor: t.label === active ? '#3d8bfd' : 'currentColor',
        bg: t.label === active ? '#262d36' : 'transparent',
      })),
      devices: [
        { name: 'hAP-ax2-meterkast', cpu: '17%', ports: ports([wan, up, off, off, off]) },
        { name: 'CRS310-kantoor', cpu: '4%', ports: ports([up, up, up, up, up, up, off, off, off, off]) },
        { name: 'hEX-PoE-zolder', cpu: '2%', ports: ports([up, poe, poe, up, up, off]) },
        { name: 'cAP-ax-woonkamer', cpu: '3%', ports: ports([up, off]) },
        { name: 'cAP-ax-overloop', cpu: '4%', ports: ports([up, off]) },
      ],
    };
  }
}
</script>
</body>
</html>
