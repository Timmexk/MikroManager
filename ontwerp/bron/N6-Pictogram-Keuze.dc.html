<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>MikroManager: drie pictogrammen naast elkaar in gebruik</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1360px; height: 720px; box-sizing: border-box; padding: 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13.5px; line-height: 1.4; color: #e6e9ed; background: #0e1114">
  <sc-for list="{{marks}}" as="c" hint-placeholder-count="3">
    <section style="box-sizing: border-box; padding: 20px; border-radius: 6px; background: #15191e; border: 1px solid {{c.frame}}; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: #98a2af"><span>{{c.label}}</span><span style="color: #6ea8fe">{{c.tag}}</span></div>

      <div style="display: flex; align-items: center; gap: 16px">
        <span style="flex: 0 0 auto; width: 88px; height: 88px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: #0a0c0f; border: 1px solid #2c343d">
          <svg width="58" height="58" viewBox="0 0 40 40" aria-hidden="true"><path d="{{c.s}}" fill="none" stroke="#c4cbd4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{c.f}}" fill="#c4cbd4"></path><path d="{{c.a}}" fill="#3d8bfd"></path></svg>
        </span>
        <div style="min-width: 0">
          <div style="font-size: 26px; line-height: 1.1; letter-spacing: -0.01em; white-space: nowrap"><span style="font-weight: 600">Mikro</span><span style="font-weight: 400; color: #98a2af">Manager</span></div>
          <div style="margin-top: 4px; color: #98a2af">Netwerkbeheer</div>
        </div>
      </div>

      <div>
        <div style="font-size: 12.5px; color: #98a2af">Op ware grootte: 16, 22, 32 en 48 pixels</div>
        <div style="display: flex; align-items: flex-end; gap: 22px; margin-top: 8px; padding: 12px 14px; border-radius: 6px; background: #0a0c0f; border: 1px solid #242a32">
          <sc-for list="{{c.sizes}}" as="z" hint-placeholder-count="4">
            <svg width="{{z.px}}" height="{{z.px}}" viewBox="0 0 40 40" aria-hidden="true"><path d="{{z.s}}" fill="none" stroke="#c4cbd4" stroke-width="{{z.sw}}" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{z.f}}" fill="#c4cbd4"></path><path d="{{z.a}}" fill="#3d8bfd"></path></svg>
          </sc-for>
        </div>
      </div>

      <div>
        <div style="font-size: 12.5px; color: #98a2af">In de zijbalk, ingeklapt, op licht en als tabblad</div>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px">
          <div style="flex: 1 1 0; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 10px; border-radius: 6px; background: #0a0c0f; border: 1px solid #242a32">
            <svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true" style="flex: 0 0 auto"><path d="{{c.s}}" fill="none" stroke="#c4cbd4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{c.f}}" fill="#c4cbd4"></path><path d="{{c.a}}" fill="#3d8bfd"></path></svg>
            <span style="font-size: 15px; font-weight: 600; white-space: nowrap">MikroManager</span>
          </div>
          <div style="flex: 0 0 48px; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #0a0c0f; border: 1px solid #242a32">
            <svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true"><path d="{{c.s}}" fill="none" stroke="#c4cbd4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{c.f}}" fill="#c4cbd4"></path><path d="{{c.a}}" fill="#3d8bfd"></path></svg>
          </div>
          <div style="flex: 0 0 48px; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #ffffff; border: 1px solid #dfe3e8">
            <svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true"><path d="{{c.s}}" fill="none" stroke="#333b45" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{c.f}}" fill="#333b45"></path><path d="{{c.a}}" fill="#1a66d9"></path></svg>
          </div>
        </div>
        <div style="display: flex; align-items: flex-end; height: 40px; margin-top: 10px; padding: 0 10px; border-radius: 6px; background: #0a0c0f; border: 1px solid #242a32">
          <div style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 8px 8px 0 0; background: #242a32; font-size: 12.5px; white-space: nowrap">
            <svg width="16" height="16" viewBox="0 0 40 40" aria-hidden="true" style="flex: 0 0 auto"><path d="{{c.s}}" fill="none" stroke="#c4cbd4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{c.f}}" fill="#c4cbd4"></path><path d="{{c.a}}" fill="#3d8bfd"></path></svg>
            Overzicht, Thuis
          </div>
        </div>
      </div>

      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; gap: 9px"><span style="flex: 0 0 auto; margin-top: 5px; width: 8px; height: 8px; background: #3fb97a" aria-hidden="true"></span><span>{{c.pro}}</span></div>
        <div style="display: flex; gap: 9px"><span style="flex: 0 0 auto; margin-top: 5px; width: 8px; height: 8px; box-sizing: border-box; border: 1px solid #98a2af" aria-hidden="true"></span><span style="color: #c4cbd4">{{c.con}}</span></div>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":720}}'>
// s = neutral line work, f = neutral solid shapes, a = the one blue accent.
// Small sizes get a heavier outline so the mark does not thin out.
const sizes = [{ px: 16, sw: 3.4 }, { px: 22, sw: 2.8 }, { px: 32, sw: 2.6 }, { px: 48, sw: 2.6 }];
class Component extends DCLogic {
  renderVals() {
    const marks = [
      { label: 'Switch 1: kastje met poorten', tag: 'mijn advies, staat nu overal', picked: true,
        pro: 'Blijft op 16 pixels herkenbaar en sluit aan op de poortblokjes die je overal in de app ziet.',
        con: 'Zegt switch, niet router of wifi.',
        s: 'M6 11h28a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3z',
        f: 'M7 17h5v6H7zM14 17h5v6h-5zM28 17h5v6h-5z',
        a: 'M21 17h5v6h-5z' },
      { label: 'Switch 2: twee apparaten in een rack', tag: '',
        pro: 'Laat zien dat je meerdere apparaten beheert, niet één.',
        con: 'Op 16 pixels lopen de twee kastjes en de poortjes in elkaar.',
        s: 'M4 7h32v11H4zM4 22h32v11H4z',
        f: 'M8 10.5h4v4H8zM14 10.5h4v4h-4zM8 25.5h4v4H8zM14 25.5h4v4h-4zM20 25.5h4v4h-4z',
        a: 'M27 10.5h5v4h-5z' },
      { label: 'Router 1: kastje met wifi', tag: '',
        pro: 'Bedraad en draadloos in één beeld; iedereen leest er een router in.',
        con: 'Lijkt op het gewone wifi-icoon, en de dunne golven vervagen op klein formaat.',
        s: 'M10 13a14 14 0 0 1 20 0M14.5 17.5a7.5 7.5 0 0 1 11 0M5 25h30v9H5z',
        f: 'M9 28.5h3v2H9zM14 28.5h3v2h-3z',
        a: 'M18.5 19.5h3v5.5h-3zM27 28h4v3h-4z' },
    ];
    return { marks: marks.map((m) => ({ ...m, sizes: sizes.map((z) => ({ ...z, s: m.s, f: m.f, a: m.a })), frame: m.picked ? '#3d8bfd' : '#242a32' })) };
  }
}
</script>
</body>
</html>
