<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Mobiel: poorten en VLAN's per poort bewerken</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#6ea8fe}a:hover{color:#a9cbff}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 16px 14px 0; display: flex; flex-direction: column; gap: 12px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13.5px; line-height: 1.4; color: #e6e9ed; background: #0e1114">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="#terug" aria-label="Terug" style="flex: 0 0 auto; width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #242a32; background: #15191e; color: #c4cbd4; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">CRS310-kantoor</h1>
      <div style="font-size: 12.5px; color: #98a2af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Poorten en VLAN's, tik op een poort om te wijzigen</div>
    </div>
  </div>

  <section style="border-radius: 6px; background: #15191e; border: 1px solid #242a32; overflow: hidden">
    <sc-for list="{{ports}}" as="p" hint-placeholder-count="10">
      <div style="border-bottom: 1px solid #1c2229; background: {{p.bg}}">
        <button type="button" aria-expanded="{{p.expanded}}" style="display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; height: 46px; padding: 0 14px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
          <span style="flex: 0 0 auto; width: 30px; height: 26px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 500; color: {{p.numColor}}; background: {{p.numBg}}; border: 1px {{p.numLine}} {{p.numBorder}}">{{p.n}}</span>
          <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-weight: 500; color: {{p.peerColor}}">{{p.peer}}</span> <span style="font-size: 12.5px; color: #98a2af">{{p.vlans}}</span></span>
          <span style="flex: 0 0 auto; font-size: 12.5px; color: {{p.tagColor}}">{{p.tag}}</span>
        </button>
        <sc-if value="{{p.open}}" hint-placeholder-val="{{false}}">
          <div style="padding: 2px 14px 14px; display: flex; flex-direction: column; gap: 6px">
            <div style="font-size: 12.5px; color: #98a2af">Untagged (PVID)</div>
            <div role="radiogroup" aria-label="Untagged VLAN van poort 8" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
              <sc-for list="{{untagged}}" as="u" hint-placeholder-count="4">
                <button type="button" role="radio" aria-checked="{{u.checked}}" style="height: 44px; padding: 0; border-radius: 6px; border: 1px solid {{u.border}}; background: {{u.bg}}; color: {{u.color}}; box-shadow: {{u.ring}}; font: inherit; font-weight: {{u.weight}}; cursor: pointer">{{u.name}}</button>
              </sc-for>
            </div>
            <div style="margin-top: 4px; font-size: 12.5px; color: #98a2af">Tagged erbij (trunk of hybrid)</div>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
              <sc-for list="{{tagged}}" as="t" hint-placeholder-count="4">
                <button type="button" aria-pressed="false" style="height: 44px; padding: 0; border-radius: 6px; border: 1px {{t.line}} #2c343d; background: #111519; color: {{t.color}}; font: inherit; cursor: {{t.cursor}}">{{t.name}}</button>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </section>

  <div style="position: absolute; left: 14px; right: 14px; bottom: 16px; min-height: 64px; box-sizing: border-box; padding: 8px 8px 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-radius: 12px; background: #1a1f25; border: 1px solid #333b45; box-shadow: 0 16px 36px rgba(0,0,0,0.6)">
    <span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="flex: 0 0 auto; width: 8px; height: 8px; background: #e0a52e" aria-hidden="true"></span><span style="min-width: 0"><span style="display: block; font-weight: 600">2 wijzigingen</span><span style="display: block; font-size: 12.5px; color: #98a2af">met veilige modus</span></span></span>
    <span style="display: flex; gap: 6px">
      <button type="button" style="height: 48px; padding: 0 12px; border-radius: 8px; border: 1px solid #3a424d; background: transparent; color: #e6e9ed; font: inherit; font-weight: 500; cursor: pointer">Verwerpen</button>
      <button type="button" style="height: 48px; padding: 0 14px; border: 0; border-radius: 8px; background: #3d8bfd; color: #06101f; font: inherit; font-weight: 600; cursor: pointer">Bekijken</button>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const active = '-';
    const tabs = [
      { label: 'Overzicht', icon: 'M4 4h7v7H4zM13 4h7v4h-7zM13 12h7v8h-7zM4 15h7v5H4z' },
      { label: 'Apparaten', icon: 'M4 5h16v6H4zM4 13h16v6H4zM7.5 8h.01M7.5 16h.01' },
      { label: 'Clients', icon: 'M3 5h13v9H3zM7 18h5M9.5 14v4M18 9h3v10h-3z' },
      { label: 'Wifi', icon: 'M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01' },
      { label: 'Meer', icon: 'M5 12h.01M12 12h.01M19 12h.01M5 6h.01M12 6h.01M19 6h.01M5 18h.01M12 18h.01M19 18h.01' },
    ];
    const page = (() => {
      const port = (n, peer, vlans, state) => {
        const mgmt = state === 'mgmt';
        const changed = state === 'changed' || state === 'open';
        const free = !peer;
        return {
          n,
          peer: peer || 'vrij',
          vlans,
          open: state === 'open',
          expanded: state === 'open' ? 'true' : 'false',
          bg: state === 'open' ? '#141c28' : 'transparent',
          peerColor: free ? '#98a2af' : '#e6e9ed',
          numColor: free ? '#98a2af' : '#0e1114',
          numBg: free ? 'transparent' : '#c4cbd4',
          numLine: 'solid',
          numBorder: free ? '#2c343d' : '#c4cbd4',
          tag: mgmt ? 'mgmt' : changed ? 'Gewijzigd' : '',
          tagColor: mgmt ? '#98a2af' : '#6ea8fe',
        };
      };
      const ports = [
        port('1', 'router', 'LAN, 3 tagged', 'mgmt'),
        port('2', 'hEX-PoE', 'LAN, 3 tagged', 'changed'),
        port('3', 'nas', 'LAN', ''),
        port('4', 'homeassistant', 'LAN', ''),
        port('5', 'werk-pc', 'LAN', ''),
        port('6', 'adguard', 'LAN', ''),
        port('7', '', 'IoT', ''),
        port('8', '', "Camera's, was LAN", 'open'),
        port('S1', '', '', ''),
        port('S2', '', '', ''),
      ];
      const pick = "Camera's";
      return {
        ports,
        untagged: ['LAN', 'IoT', 'Gasten', "Camera's"].map((name) => ({
          name,
          checked: name === pick ? 'true' : 'false',
          bg: name === pick ? '#c4cbd4' : '#111519',
          color: name === pick ? '#0e1114' : '#c4cbd4',
          border: name === pick ? '#c4cbd4' : '#2c343d',
          weight: name === pick ? 600 : 400,
          ring: name === pick ? '0 0 0 2px #3d8bfd' : 'none',
        })),
        tagged: ['LAN', 'IoT', 'Gasten', "Camera's"].map((name) => ({
          name,
          line: name === pick ? 'dashed' : 'solid',
          color: name === pick ? '#5d6875' : '#c4cbd4',
          cursor: name === pick ? 'not-allowed' : 'pointer',
        })),
      };
    })();
    return {
      tabs: tabs.map((t) => ({
        ...t,
        color: t.label === active ? '#ffffff' : '#98a2af',
        iconColor: t.label === active ? '#3d8bfd' : 'currentColor',
        bg: t.label === active ? '#262d36' : 'transparent',
      })),
      ...page,
    };
  }
}
</script>
</body>
</html>
