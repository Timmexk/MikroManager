<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Inloggen: wachtwoord of passkey</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#6ea8fe}a:hover{color:#a9cbff}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 32px 22px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 40px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13.5px; line-height: 1.4; color: #e6e9ed; background: #0a0c0f">
  <sc-for list="{{variants}}" as="v" hint-placeholder-count="2">
    <div style="flex: 0 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
      <div style="font-size: 12.5px; color: #98a2af">{{v.caption}}</div>
      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true" style="flex: 0 0 auto"><path d="M6 11h28a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3z" fill="none" stroke="#c4cbd4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M7 17h5v6H7zM14 17h5v6h-5zM28 17h5v6h-5z" fill="#c4cbd4"></path><path d="M21 17h5v6h-5z" fill="#3d8bfd"></path></svg>
        <span style="font-size: 18px; font-weight: 600; letter-spacing: 0.01em">MikroManager</span>
      </div>

      <form style="margin: 0; padding: 22px; border-radius: 6px; background: #15191e; border: 1px solid #242a32; display: flex; flex-direction: column; gap: 14px">
        <h1 style="margin: 0; font-size: 20px; font-weight: 600">Inloggen</h1>

        <sc-if value="{{v.error}}" hint-placeholder-val="{{false}}">
          <div role="alert" style="display: flex; gap: 10px; padding: 10px 12px; border-radius: 6px; background: #1d1414; border: 1px solid #5a2a27">
            <span style="flex: 0 0 auto; margin-top: 5px; width: 8px; height: 8px; background: #f0655d" aria-hidden="true"></span>
            <div><div style="font-weight: 600; color: #ff8b84">Gebruikersnaam of wachtwoord klopt niet</div><div style="color: #c4cbd4">Nog 2 pogingen. Daarna wacht je 1 minuut.</div></div>
          </div>
        </sc-if>

        <label style="display: flex; flex-direction: column; gap: 5px">
          <span style="font-size: 12.5px; color: #98a2af">Gebruikersnaam</span>
          <input type="text" value="{{v.user}}" autocomplete="username" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; border: 1px solid #2c343d; background: #111519; color: #e6e9ed; font: inherit">
        </label>
        <label style="display: flex; flex-direction: column; gap: 5px">
          <span style="font-size: 12.5px; color: #98a2af">Wachtwoord</span>
          <span style="display: flex; gap: 8px">
            <input type="password" value="{{v.pass}}" autocomplete="current-password" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; border: 1px solid {{v.passBorder}}; background: #111519; color: #e6e9ed; font: inherit">
            <button type="button" style="flex: 0 0 auto; height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #2c343d; background: #111519; color: #c4cbd4; font: inherit; cursor: pointer">Tonen</button>
          </span>
        </label>
        <label style="display: flex; align-items: center; gap: 9px; min-height: 28px; color: #c4cbd4; cursor: pointer">
          <input type="checkbox" checked style="width: 16px; height: 16px; margin: 0; accent-color: #3d8bfd">
          <span>Ingelogd blijven op dit apparaat, 30 dagen</span>
        </label>
        <button type="button" style="height: 44px; border: 0; border-radius: 6px; background: #3d8bfd; color: #06101f; font: inherit; font-weight: 600; cursor: pointer">Inloggen</button>

        <div style="display: flex; align-items: center; gap: 12px; color: #98a2af; font-size: 12.5px"><span style="flex: 1; height: 1px; background: #242a32"></span>of<span style="flex: 1; height: 1px; background: #242a32"></span></div>

        <button type="button" style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 6px; border: 1px solid #2c343d; background: #111519; color: #e6e9ed; font: inherit; font-weight: 500; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 11a4 4 0 1 1 0 .01M11.5 12.5L20 21M16 17l2-2M18.5 19.5l2-2"></path></svg>
          Inloggen met passkey
        </button>
      </form>

      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; color: #98a2af">
        <div style="display: flex; border-radius: 6px; border: 1px solid #242a32; overflow: hidden">
          <button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border: 0; background: #242a32; color: #ffffff; font: inherit; font-weight: 500; cursor: pointer">Nederlands</button>
          <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border: 0; border-left: 1px solid #242a32; background: #0a0c0f; color: #98a2af; font: inherit; cursor: pointer">English</button>
        </div>
        <span>Wachtwoord kwijt? Vraag het een admin.</span>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      variants: [
        { caption: 'Normaal', error: false, user: '', pass: '', passBorder: '#2c343d' },
        { caption: 'Na een verkeerd wachtwoord', error: true, user: 'sanne', pass: 'verkeerd', passBorder: '#f0655d' },
      ],
    };
  }
}
</script>
</body>
</html>
