<html lang="nl">
<head>
<meta charset="utf-8">
<title>Inloggen op mobiel: passkey eerst</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

a{color:#6ea8fe}a:hover{color:#a9cbff}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 72px 20px 24px; display: flex; flex-direction: column; gap: 18px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14.5px; line-height: 1.4; color: #e6e9ed; background: #0a0c0f">

  <div style="display: flex; align-items: center; gap: 10px">
    <svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true" style="flex: 0 0 auto"><path d="M6 11h28a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3z" fill="none" stroke="#c4cbd4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M7 17h5v6H7zM14 17h5v6h-5zM28 17h5v6h-5z" fill="#c4cbd4"></path><path d="M21 17h5v6h-5z" fill="#3d8bfd"></path></svg>
    <span style="font-size: 20px; font-weight: 600; letter-spacing: 0.01em">MikroManager</span>
  </div>

  <div>
    <h1 style="margin: 0; font-size: 24px; font-weight: 600">Inloggen</h1>
    <div style="margin-top: 4px; color: #98a2af">Laatst ingelogd als sanne op dit toestel</div>
  </div>

  <button type="button" style="min-height: 64px; padding: 10px 16px; display: flex; align-items: center; gap: 14px; border: 0; border-radius: 8px; background: #3d8bfd; color: #06101f; font: inherit; text-align: left; cursor: pointer">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M8 11a4 4 0 1 1 0 .01M11.5 12.5L20 21M16 17l2-2M18.5 19.5l2-2"></path></svg>
    <span><span style="display: block; font-size: 16px; font-weight: 600">Inloggen met passkey</span><span style="display: block; font-size: 13.5px">Gezicht, vingerafdruk of schermcode</span></span>
  </button>

  <div style="display: flex; align-items: center; gap: 12px; color: #98a2af; font-size: 13px"><span style="flex: 1; height: 1px; background: #242a32"></span>of met wachtwoord<span style="flex: 1; height: 1px; background: #242a32"></span></div>

  <form style="margin: 0; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; color: #98a2af">Gebruikersnaam</span>
      <input type="text" value="sanne" autocomplete="username" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #2c343d; background: #15191e; color: #e6e9ed; font: inherit; font-size: 16px">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; color: #98a2af">Wachtwoord</span>
      <span style="display: flex; gap: 8px">
        <input type="password" value="" autocomplete="current-password" style="flex: 1; min-width: 0; height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #2c343d; background: #15191e; color: #e6e9ed; font: inherit; font-size: 16px">
        <button type="button" style="flex: 0 0 auto; height: 50px; padding: 0 14px; border-radius: 8px; border: 1px solid #2c343d; background: #15191e; color: #c4cbd4; font: inherit; cursor: pointer">Tonen</button>
      </span>
    </label>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; color: #c4cbd4">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #3d8bfd">
      <span>Ingelogd blijven, 30 dagen</span>
    </label>
    <button type="button" style="height: 50px; border-radius: 8px; border: 1px solid #2c343d; background: #15191e; color: #e6e9ed; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Inloggen</button>
  </form>

  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; color: #98a2af; font-size: 13px">
    <span>Wachtwoord kwijt? Vraag het een admin.</span>
    <div style="display: flex; border-radius: 8px; border: 1px solid #242a32; overflow: hidden">
      <button type="button" aria-pressed="true" style="height: 44px; padding: 0 16px; border: 0; background: #242a32; color: #ffffff; font: inherit; font-weight: 500; cursor: pointer">Nederlands</button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px; border: 0; border-left: 1px solid #242a32; background: #0a0c0f; color: #98a2af; font: inherit; cursor: pointer">English</button>
    </div>
  </div>

</div>
