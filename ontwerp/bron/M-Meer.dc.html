<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Mobiel: het Meer-menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#6ea8fe}a:hover{color:#a9cbff}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 16px 14px 0; display: flex; flex-direction: column; gap: 12px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13.5px; line-height: 1.4; color: #e6e9ed; background: #0e1114">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <button type="button" aria-label="Site kiezen, nu Thuis" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px 0 8px; border-radius: 6px; border: 1px solid #242a32; background: #15191e; color: inherit; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
      <span style="width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; color: #0a0c0f; background: #3d8bfd">T</span>
      <span>Thuis</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98a2af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" aria-label="Zoeken" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 6px; border: 1px solid #242a32; background: #15191e; color: #c4cbd4; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>
      </button>
      <button type="button" aria-label="Meldingen, 2 nieuw" style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 6px; border: 1px solid #242a32; background: #15191e; color: #c4cbd4; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7 2.5 7h-17S6 15 6 9zM10 20a2.2 2.2 0 0 0 4 0"></path></svg>
        <span style="position: absolute; top: 7px; right: 7px; min-width: 14px; height: 14px; border-radius: 3px; font-size: 10.5px; font-weight: 600; line-height: 14px; text-align: center; color: #1a1300; background: #e0a52e">2</span>
      </button>
    </div>
  </div>

  <section style="border-radius: 6px; background: #15191e; border: 1px solid #242a32; overflow: hidden">
    <div style="display: flex; align-items: center; height: 34px; padding: 0 14px; font-size: 12px; font-weight: 500; color: #98a2af; background: #111519">Deze site: Thuis</div>
    <sc-for list="{{site}}" as="i" hint-placeholder-count="5">
      <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; height: 50px; padding: 0 14px; border: 0; border-top: 1px solid #1c2229; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#98a2af" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="{{i.icon}}"></path></svg>
        <span style="flex: 1; min-width: 0; font-weight: 500">{{i.label}}</span>
        <span style="flex: 0 0 auto; font-size: 12.5px; color: {{i.noteColor}}">{{i.note}}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98a2af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </sc-for>
  </section>

  <section style="border-radius: 6px; background: #15191e; border: 1px solid #242a32; overflow: hidden">
    <div style="display: flex; align-items: center; height: 34px; padding: 0 14px; font-size: 12px; font-weight: 500; color: #98a2af; background: #111519">Hele app</div>
    <sc-for list="{{app}}" as="i" hint-placeholder-count="3">
      <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; height: 50px; padding: 0 14px; border: 0; border-top: 1px solid #1c2229; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#98a2af" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="{{i.icon}}"></path></svg>
        <span style="flex: 1; min-width: 0; font-weight: 500">{{i.label}}</span>
        <span style="flex: 0 0 auto; font-size: 12.5px; color: {{i.noteColor}}">{{i.note}}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98a2af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </sc-for>
  </section>

  <section style="border-radius: 6px; background: #15191e; border: 1px solid #242a32; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; padding: 0 14px">
      <span style="font-weight: 500">Thema</span>
      <div style="display: flex; border-radius: 6px; border: 1px solid #2c343d; overflow: hidden">
        <button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border: 0; background: #242a32; color: #ffffff; font: inherit; font-weight: 600; cursor: pointer">Donker</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border: 0; border-left: 1px solid #2c343d; background: #111519; color: #98a2af; font: inherit; cursor: pointer">Licht</button>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; padding: 0 14px; border-top: 1px solid #1c2229">
      <span style="font-weight: 500">Taal</span>
      <div style="display: flex; border-radius: 6px; border: 1px solid #2c343d; overflow: hidden">
        <button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border: 0; background: #242a32; color: #ffffff; font: inherit; font-weight: 600; cursor: pointer">Nederlands</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border: 0; border-left: 1px solid #2c343d; background: #111519; color: #98a2af; font: inherit; cursor: pointer">English</button>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; padding: 0 8px 0 14px; border-top: 1px solid #1c2229">
      <span><span style="font-weight: 500">admin</span> <span style="font-size: 12.5px; color: #98a2af">Admin, alle sites</span></span>
      <button type="button" style="height: 44px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #ff8b84; font: inherit; font-weight: 500; cursor: pointer">Uitloggen</button>
    </div>
  </section>
  <nav aria-label="Hoofdmenu" style="position: absolute; left: 14px; right: 14px; bottom: 16px; height: 64px; box-sizing: border-box; padding: 5px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; border-radius: 12px; background: #1a1f25; border: 1px solid #333b45; box-shadow: 0 16px 36px rgba(0,0,0,0.6)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; padding: 0; border: 0; border-radius: 8px; font: inherit; font-size: 11px; font-weight: 500; cursor: pointer; color: {{t.color}}; background: {{t.bg}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.iconColor}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
      </button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const active = 'Meer';
    const tabs = [
      { label: 'Overzicht', icon: 'M4 4h7v7H4zM13 4h7v4h-7zM13 12h7v8h-7zM4 15h7v5H4z' },
      { label: 'Apparaten', icon: 'M4 5h16v6H4zM4 13h16v6H4zM7.5 8h.01M7.5 16h.01' },
      { label: 'Clients', icon: 'M3 5h13v9H3zM7 18h5M9.5 14v4M18 9h3v10h-3z' },
      { label: 'Wifi', icon: 'M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01' },
      { label: 'Meer', icon: 'M5 12h.01M12 12h.01M19 12h.01M5 6h.01M12 6h.01M19 6h.01M5 18h.01M12 18h.01M19 18h.01' },
    ];
    const page = (() => {
      const item = (label, icon, note, warn) => ({ label, icon, note: note || '', noteColor: warn ? '#e0a52e' : '#98a2af' });
      return {
        site: [
          item('Netwerken', 'M12 3l9 5-9 5-9-5zM3 12.5l9 5 9-5M3 17l9 5 9-5', '4 netwerken, 2 WAN'),
          item('Topologie', 'M9 3h6v4H9zM3 17h6v4H3zM15 17h6v4h-6zM12 7v5M6 17v-5h12v5', ''),
          item('Onderhoud', 'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z', '5 updates, wijzigingslog', true),
        ],
        app: [
          item('Instellingen', 'M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4M14 4v4M6 10v4M12 16v4', ''),
          item('Gebruikers', 'M9 11a3.5 3.5 0 1 0 0-7a3.5 3.5 0 0 0 0 7zM2.5 20a6.5 6.5 0 0 1 13 0M16.5 4.5a3.5 3.5 0 0 1 0 6.5M18 14.5a6.5 6.5 0 0 1 3.5 5.5', '6'),
          item('Meldingen instellen', 'M6 9a6 6 0 0 1 12 0c0 6 2.5 7 2.5 7h-17S6 15 6 9zM10 20a2.2 2.2 0 0 0 4 0', '7 van 9 aan'),
        ],
      };
    })();
    return {
      tabs: tabs.map((t) => ({
        ...t,
        color: t.label === active ? '#ffffff' : '#98a2af',
        iconColor: t.label === active ? '#3d8bfd' : 'currentColor',
        bg: t.label === active ? '#262d36' : 'transparent',
      })),
      ...page,
    };
  }
}
</script>
</body>
</html>
