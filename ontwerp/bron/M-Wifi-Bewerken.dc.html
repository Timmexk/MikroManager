<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Mobiel: wifi-netwerk bewerken met opslaanbalk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#6ea8fe}a:hover{color:#a9cbff}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 16px 14px 0; display: flex; flex-direction: column; gap: 12px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13.5px; line-height: 1.4; color: #e6e9ed; background: #0e1114">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="#terug" aria-label="Terug" style="flex: 0 0 auto; width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #242a32; background: #15191e; color: #c4cbd4; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Thuis-IoT</h1>
      <div style="font-size: 12.5px; color: #98a2af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Wifi-netwerk, 6 clients verbonden</div>
    </div>
  </div>

  <section style="border-radius: 6px; background: #15191e; border: 1px solid #242a32; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; flex-direction: column; gap: 5px">
      <span style="font-size: 12.5px; color: #98a2af">Naam (SSID)</span>
      <input type="text" value="Thuis-IoT" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; border: 1px solid #2c343d; background: #111519; color: #e6e9ed; font: inherit; font-size: 16px">
    </label>
    <label style="display: flex; flex-direction: column; gap: 5px">
      <span style="font-size: 12.5px; color: #98a2af">Wachtwoord</span>
      <span style="display: flex; gap: 8px">
        <input type="password" value="slimme-lampen-2026" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; border: 1px solid #2c343d; background: #111519; color: #e6e9ed; font: inherit; font-size: 16px">
        <button type="button" style="flex: 0 0 auto; height: 48px; padding: 0 12px; border-radius: 6px; border: 1px solid #2c343d; background: #111519; color: #c4cbd4; font: inherit; cursor: pointer">Tonen</button>
      </span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 5px">
      <span style="display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px"><span style="color: #98a2af">Beveiliging</span><span style="color: #6ea8fe">Gewijzigd, was: WPA2</span></span>
      <select style="height: 48px; box-sizing: border-box; padding: 0 10px; border-radius: 6px; border: 1px solid #3d8bfd; background: #141c28; color: #e6e9ed; font: inherit; font-size: 16px">
        <option>WPA2 + WPA3</option>
        <option>WPA2</option>
        <option>Alleen WPA3</option>
      </select>
    </label>
  </section>

  <section style="border-radius: 6px; background: #15191e; border: 1px solid #242a32; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 38px; padding: 0 14px">
      <h2 style="margin: 0; font-size: 13.5px; font-weight: 600">Uitzenden per AP en band</h2>
      <span style="font-size: 12.5px; color: #6ea8fe">Gewijzigd</span>
    </div>
    <sc-for list="{{aps}}" as="a" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 4px 14px; border-top: 1px solid #1c2229">
        <span style="flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.name}}</span>
        <sc-for list="{{a.bands}}" as="b" hint-placeholder-count="2">
          <button type="button" aria-pressed="{{b.pressed}}" style="flex: 0 0 auto; min-width: 62px; height: 44px; padding: 0 10px; border-radius: 6px; border: 1px solid {{b.border}}; background: {{b.bg}}; color: {{b.color}}; box-shadow: {{b.ring}}; font: inherit; font-weight: 500; cursor: pointer">{{b.band}}</button>
        </sc-for>
      </div>
    </sc-for>
  </section>

  <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; min-height: 52px; padding: 4px 14px; border-radius: 6px; border: 1px solid #242a32; background: #15191e; color: inherit; font: inherit; text-align: left; cursor: pointer">
    <span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600">Geavanceerd, alleen dit SSID</span><span style="display: block; font-size: 12.5px; color: #98a2af">Snelle roaming uit, client-isolatie uit</span></span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98a2af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </button>

  <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; min-height: 60px; padding: 6px 14px; border-radius: 6px; border: 1px solid #242a32; background: #15191e; color: inherit; font: inherit; text-align: left; cursor: pointer">
    <span style="flex: 0 0 auto; width: 8px; height: 8px; background: #e0a52e" aria-hidden="true"></span>
    <span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600">Wat er verandert: 5 stappen</span><span style="display: block; font-size: 12.5px; color: #98a2af">6 clients moeten opnieuw associëren</span></span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98a2af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </button>

  <div style="position: absolute; left: 14px; right: 14px; bottom: 16px; min-height: 64px; box-sizing: border-box; padding: 8px 8px 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-radius: 12px; background: #1a1f25; border: 1px solid #333b45; box-shadow: 0 16px 36px rgba(0,0,0,0.6)">
    <span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="flex: 0 0 auto; width: 8px; height: 8px; background: #3d8bfd" aria-hidden="true"></span><span style="font-weight: 600">2 wijzigingen</span></span>
    <span style="display: flex; gap: 6px">
      <button type="button" style="height: 48px; padding: 0 12px; border-radius: 8px; border: 1px solid #3a424d; background: transparent; color: #e6e9ed; font: inherit; font-weight: 500; cursor: pointer">Verwerpen</button>
      <button type="button" style="height: 48px; padding: 0 16px; border: 0; border-radius: 8px; background: #3d8bfd; color: #06101f; font: inherit; font-weight: 600; cursor: pointer">Opslaan</button>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const active = '-';
    const tabs = [
      { label: 'Overzicht', icon: 'M4 4h7v7H4zM13 4h7v4h-7zM13 12h7v8h-7zM4 15h7v5H4z' },
      { label: 'Apparaten', icon: 'M4 5h16v6H4zM4 13h16v6H4zM7.5 8h.01M7.5 16h.01' },
      { label: 'Clients', icon: 'M3 5h13v9H3zM7 18h5M9.5 14v4M18 9h3v10h-3z' },
      { label: 'Wifi', icon: 'M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01' },
      { label: 'Meer', icon: 'M5 12h.01M12 12h.01M19 12h.01M5 6h.01M12 6h.01M19 6h.01M5 18h.01M12 18h.01M19 18h.01' },
    ];
    const page = (() => {
      const band = (band, on, changed) => ({
        band,
        pressed: on ? 'true' : 'false',
        bg: on ? '#242a32' : '#111519',
        color: on ? '#ffffff' : '#98a2af',
        border: on ? '#3a424d' : '#2c343d',
        ring: changed ? '0 0 0 2px #3d8bfd' : 'none',
      });
      return {
        aps: [
          { name: 'cAP-ax-woonkamer', bands: [band('2,4', true, false), band('5 GHz', false, true)] },
          { name: 'cAP-ax-overloop', bands: [band('2,4', true, false), band('5 GHz', false, true)] },
          { name: 'hAP-ax2-meterkast', bands: [band('2,4', true, false), band('5 GHz', false, true)] },
        ],
      };
    })();
    return {
      tabs: tabs.map((t) => ({
        ...t,
        color: t.label === active ? '#ffffff' : '#98a2af',
        iconColor: t.label === active ? '#3d8bfd' : 'currentColor',
        bg: t.label === active ? '#262d36' : 'transparent',
      })),
      ...page,
    };
  }
}
</script>
</body>
</html>
