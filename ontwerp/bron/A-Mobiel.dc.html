        <div style="font-size: 12.5px; color: rgba(238,243,251,0.68)">laatste 6 uur</div>

        <div style="display: flex; flex-direction: column; align-items: flex-end">

        <path d="M0.0,46.7L12.5,35.8L25.0,57.9L37.5,81.7L50.0,83.1L62.5,75.6L75.0,79.9L87.5,85.9L100.0,71.2L112.5,45.4L125.0,43.2L137.5,74.8L150.0,111.4L162.5,129.5L175.0,141.0L187.5,163.5L200.0,183.0L212.5,173.8L225.0,144.4L237.5,130.7L250.0,146.2L262.5,165.9L275.0,169.3L287.5,169.7L300.0,183.5L312.5,194.3L325.0,173.8L337.5,128.4L350.0,94.4L362.5,87.5L375.0,86.9L387.5,75.9L400.0,70.0L412.5,86.4L425.0,106.7L437.5,99.1L450.0,66.3L462.5,42.3L475.0,42.8L487.5,48.9L500.0,46.4L512.5,53.7L525.0,88.7L537.5,132.2L550.0,149.1L562.5,137.9L575.0,128.9L587.5,136.0L600.0,140.7" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
        <path d="M0.0,174.7L12.5,177.8L25.0,177.9L37.5,173.2L50.0,170.0L62.5,173.6L75.0,181.3L87.5,186.5L100.0,188.8L112.5,192.5L125.0,197.5L137.5,198.0L150.0,192.5L162.5,186.4L175.0,185.9L187.5,188.9L200.0,189.8L212.5,188.6L225.0,189.8L237.5,193.0L250.0,192.1L262.5,184.2L275.0,175.3L287.5,171.4L300.0,171.2L312.5,169.6L325.0,167.5L337.5,169.7L350.0,175.6L362.5,178.4L375.0,174.6L387.5,169.2L400.0,168.2L412.5,170.0L425.0,170.3L437.5,170.3L450.0,175.2L462.5,184.8L475.0,191.7L487.5,191.8L500.0,189.2L512.5,189.2L525.0,190.3L537.5,188.2L550.0,185.0L562.5,186.7L575.0,193.5L587.5,198.0L600.0,196.8" fill="none" stroke="#d95926" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
      </svg>
      <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: rgba(238,243,251,0.68); font-variant-numeric: tabular-nums">
        <span>11:30</span><span>piek 50 Mbps</span><span>17:30</span>
      </div>
    </div>
  </section>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.06); backdrop-filter: blur(22px) saturate(140%); color: inherit; font: inherit; text-align: left; cursor: pointer">
      <span style="font-size: 12.5px; color: rgba(238,243,251,0.72)">Wifi</span>
      <span style="font-size: 20px; font-weight: 700">13 clients</span>
      <span style="font-size: 12.5px; color: rgba(238,243,251,0.72)">op 3 netwerken</span>
    </button>
    <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 16px; border-radius: 20px; border: 1px solid rgba(255,200,87,0.36); background: rgba(255,200,87,0.10); backdrop-filter: blur(22px) saturate(140%); color: inherit; font: inherit; text-align: left; cursor: pointer">
      <span style="font-size: 12.5px; color: rgba(238,243,251,0.72)">Updates</span>
      <span style="font-size: 20px; font-weight: 700">5 klaar</span>
      <span style="font-size: 12.5px; color: rgba(238,243,251,0.72)">RouterOS 7.20.2</span>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 2px 4px 2px; font-size: 16px; font-weight: 700">Apparaten</h2>
    <sc-for list="{{devices}}" as="d" hint-placeholder-count="4">
      <button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.06); backdrop-filter: blur(22px) saturate(140%); color: inherit; font: inherit; text-align: left; cursor: pointer">
        <span style="flex: 0 0 auto; width: 9px; height: 9px; border-radius: 5px; background: #4ade9a; box-shadow: 0 0 10px rgba(74,222,154,0.7)" aria-hidden="true"></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.name}}</span>
          <span style="font-size: 12.5px; color: rgba(238,243,251,0.68)">{{d.note}}</span>
        </span>
        <span style="flex: 0 0 auto; display: inline-flex; gap: 3px; padding: 6px 7px; border-radius: 9px; background: rgba(0,0,0,0.30)" aria-hidden="true">
          <sc-for list="{{d.ports}}" as="p" hint-placeholder-count="5">
            <span style="width: 9px; height: 9px; border-radius: 2px; background: {{p.c}}"></span>
          </sc-for>
        </span>
      </button>
    </sc-for>
  </div>

  <nav aria-label="Hoofdmenu" style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 68px; box-sizing: border-box; padding: 6px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; border-radius: 28px; background: rgba(20,28,46,0.72); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 18px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.10); backdrop-filter: blur(26px) saturate(150%)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 54px; padding: 0; border: 0; border-radius: 22px; font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; color: {{t.color}}; background: {{t.bg}}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
      </button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const up = '#4ade9a', poe = '#ffc857', wan = '#5aa9ff', off = 'rgba(255,255,255,0.18)';
    const ports = (list) => list.map((c) => ({ c }));
    const tabs = [
      { label: 'Overzicht', icon: 'M4 4h7v7H4zM13 4h7v4h-7zM13 12h7v8h-7zM4 15h7v5H4z', active: true },
      { label: 'Apparaten', icon: 'M4 5h16v6H4zM4 13h16v6H4zM7.5 8h.01M7.5 16h.01' },
      { label: 'Clients', icon: 'M3 5h13v9H3zM7 18h5M9.5 14v4M18 9h3v10h-3z' },
      { label: 'Wifi', icon: 'M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01' },
      { label: 'Meer', icon: 'M5 12h.01M12 12h.01M19 12h.01M5 6h.01M12 6h.01M19 6h.01M5 18h.01M12 18h.01M19 18h.01' },
    ];
    return {
      tabs: tabs.map((t) => ({
        ...t,
        color: t.active ? '#ffffff' : 'rgba(238,243,251,0.72)',
        bg: t.active ? 'rgba(90,169,255,0.26)' : 'transparent',
      })),
      devices: [
        { name: 'hAP-ax2-meterkast', note: 'Router, 3 wifi-clients', ports: ports([wan, up, off, off, off]) },
        { name: 'CRS310-kantoor', note: 'Switch, 6 van 10 poorten', ports: ports([up, up, up, up, up, up, off, off, off, off]) },
        { name: 'hEX-PoE-zolder', note: 'Switch, 13,8 W PoE', ports: ports([up, poe, poe, up, up, off]) },
        { name: 'cAP-ax-woonkamer', note: 'Access point, 6 clients', ports: ports([up, off]) },
        { name: 'cAP-ax-overloop', note: 'Access point, 4 clients', ports: ports([up, off]) },
      ],
    };
  }
}
</script>
</body>
</html>
