<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Meldingencentrum: opent vanuit de bel in de zijbalk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#6ea8fe}a:hover{color:#a9cbff}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13.5px; line-height: 1.4; color: #e6e9ed; background: #0e1114">

  <aside style="flex: 0 0 auto; width: {{sideW}}; box-sizing: border-box; padding: 12px 8px; background: #0a0c0f; border-right: 1px solid #242a32; display: flex; flex-direction: column; gap: 10px; transition: width 0.2s ease">
    <div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; justify-content: {{sideJustify}}">
      <svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true" style="flex: 0 0 auto"><path d="M6 11h28a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3z" fill="none" stroke="#c4cbd4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M7 17h5v6H7zM14 17h5v6h-5zM28 17h5v6h-5z" fill="#c4cbd4"></path><path d="M21 17h5v6h-5z" fill="#3d8bfd"></path></svg>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}">
        <span style="font-size: 15px; font-weight: 600; letter-spacing: 0.01em">MikroManager</span>
      </sc-if>
    </div>
    <button type="button" aria-label="Site kiezen, nu Thuis" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px; border-radius: 6px; border: 1px solid #242a32; background: #15191e; color: inherit; font: inherit; cursor: pointer; text-align: left; justify-content: {{sideJustify}}">
      <span style="flex: 0 0 auto; width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; color: #0a0c0f; background: #3d8bfd">T</span>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}">
        <span style="flex: 1; font-weight: 500">Thuis</span>
      </sc-if>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98a2af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"></path></svg>
      </sc-if>
    </button>
    <button type="button" aria-label="Zoeken, Ctrl K" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 6px; border: 1px solid #242a32; background: transparent; color: #98a2af; font: inherit; cursor: pointer; text-align: left; justify-content: {{sideJustify}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}">
        <span style="flex: 1">Zoeken</span>
      </sc-if>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; padding: 1px 5px; border-radius: 3px; border: 1px solid #2c343d">Ctrl K</span>
      </sc-if>
    </button>
    <nav style="display: flex; flex-direction: column; gap: 1px" aria-label="Hoofdmenu">
      <sc-for list="{{nav}}" as="item" hint-placeholder-count="8">
        <button type="button" aria-label="{{item.label}}" style="position: relative; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px; border: 0; font: inherit; font-weight: 500; cursor: pointer; text-align: left; color: {{item.color}}; background: {{item.bg}}; justify-content: {{item.justify}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{item.iconColor}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="{{item.icon}}"></path></svg>
          <sc-if value="{{item.showLabel}}" hint-placeholder-val="{{true}}">
            <span style="flex: 1">{{item.label}}</span>
          </sc-if>
          <sc-if value="{{item.showBadge}}" hint-placeholder-val="{{false}}">
            <span style="min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 500; display: flex; align-items: center; justify-content: center; color: #1a1300; background: #e0a52e">{{item.badge}}</span>
          </sc-if>
          <sc-if value="{{item.showDot}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; top: 10px; right: 8px; width: 6px; height: 6px; background: #e0a52e" aria-hidden="true"></span>
          </sc-if>
        </button>
      </sc-for>
    </nav>
    <button type="button" aria-label="Meldingen, 2 vragen aandacht" style="margin-top: auto; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; color: #b3bcc8; font: inherit; font-weight: 500; cursor: pointer; text-align: left; justify-content: {{sideJustify}}">
      <span style="position: relative; flex: 0 0 auto; display: flex">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7 2.5 7h-17S6 15 6 9zM10 20a2.2 2.2 0 0 0 4 0"></path></svg>
        <span style="position: absolute; top: -7px; right: -9px; min-width: 15px; height: 15px; box-sizing: border-box; padding: 0 3px; border-radius: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600; line-height: 15px; text-align: center; color: #1a1300; background: #e0a52e">2</span>
      </span>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}">
        <span style="flex: 1">Meldingen</span>
      </sc-if>
    </button>
    <button type="button" aria-label="Account van admin" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px; border-radius: 6px; border: 1px solid #242a32; background: #15191e; color: inherit; font: inherit; cursor: pointer; text-align: left; justify-content: {{sideJustify}}">
      <span style="flex: 0 0 auto; width: 26px; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 600; color: #c4cbd4; background: #242a32" aria-hidden="true">HB</span>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 500">admin</span><span style="font-size: 12px; color: #98a2af">Admin, alle sites</span></span>
      </sc-if>
    </button>
    <button type="button" onClick="{{toggle}}" aria-label="Zijbalk in- of uitklappen" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; color: #98a2af; font: inherit; font-weight: 500; cursor: pointer; justify-content: {{sideJustify}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="{{toggleIcon}}"></path></svg>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}">
        <span>Inklappen</span>
      </sc-if>
    </button>
  </aside>

  <main style="position: relative; flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 16px 22px 20px; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px">
      <h1 style="margin: 0; font-size: 20px; font-weight: 600">Overzicht</h1>
      <span style="color: #98a2af">Thuis</span>
    </header>

    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); border-radius: 6px; background: #15191e; border: 1px solid #242a32">
      <div style="padding: 11px 14px; border-right: 1px solid #242a32"><div style="font-size: 12.5px; color: #98a2af">WAN</div><div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600"><span style="width: 8px; height: 8px; background: #3fb97a" aria-hidden="true"></span>Kabel actief</div></div>
      <div style="padding: 11px 14px; border-right: 1px solid #242a32"><div style="font-size: 12.5px; color: #98a2af">Apparaten</div><div style="font-size: 16px; font-weight: 600">5 van 5 online</div></div>
      <div style="padding: 11px 14px"><div style="font-size: 12.5px; color: #98a2af">Clients</div><div style="font-size: 16px; font-weight: 600">19 <span style="font-size: 12.5px; font-weight: 400; color: #98a2af">13 wifi, 6 bedraad</span></div></div>
    </section>

    <section aria-label="Meldingen" style="position: absolute; left: 10px; bottom: 20px; width: min(460px, calc(100% - 20px)); box-sizing: border-box; border-radius: 6px; background: #15191e; border: 1px solid #3a424d; box-shadow: 0 24px 60px rgba(0,0,0,0.6)">
      <span style="position: absolute; left: -7px; bottom: 120px; width: 12px; height: 12px; box-sizing: border-box; background: #15191e; border-left: 1px solid #3a424d; border-bottom: 1px solid #3a424d; transform: rotate(45deg)" aria-hidden="true"></span>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 48px; padding: 0 8px 0 14px; border-bottom: 1px solid #242a32">
        <h2 style="margin: 0; font-size: 14.5px; font-weight: 600">Meldingen</h2>
        <div style="display: flex; border-radius: 6px; border: 1px solid #242a32; overflow: hidden">
          <button type="button" aria-pressed="true" style="height: 32px; padding: 0 10px; border: 0; background: #242a32; color: #ffffff; font: inherit; font-weight: 500; cursor: pointer">Aandacht 2</button>
          <button type="button" aria-pressed="false" style="height: 32px; padding: 0 10px; border: 0; border-left: 1px solid #242a32; background: #15191e; color: #98a2af; font: inherit; cursor: pointer">Alle sites</button>
        </div>
      </div>

      <sc-for list="{{items}}" as="m" hint-placeholder-count="6">
        <div style="display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #1c2229; background: {{m.bg}}">
          <span style="margin-top: 6px; width: 8px; height: 8px; background: {{m.dot}}" aria-hidden="true"></span>
          <div style="min-width: 0">
            <div style="font-weight: {{m.weight}}">{{m.title}}</div>
            <div style="color: #98a2af">{{m.detail}}</div>
            <sc-if value="{{m.hasAction}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; gap: 6px; margin-top: 8px">
                <sc-for list="{{m.actions}}" as="a" hint-placeholder-count="1">
                  <button type="button" style="height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #2c343d; background: #111519; color: #e6e9ed; font: inherit; font-weight: 500; cursor: pointer">{{a.label}}</button>
                </sc-for>
              </div>
            </sc-if>
          </div>
          <span style="font-size: 12.5px; color: #98a2af; white-space: nowrap">{{m.when}}</span>
        </div>
      </sc-for>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; padding: 0 14px">
        <a href="#meldingen-instellen">Meldingen instellen</a>
        <button type="button" style="height: 32px; padding: 0 10px; border-radius: 6px; border: 0; background: transparent; color: #98a2af; font: inherit; cursor: pointer">Alles als gelezen markeren</button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"collapsed":{"editor":"boolean","default":false},"$preview":{"width":900,"height":760}}'>
class Component extends DCLogic {
  state = { collapsed: null };

  renderVals() {
    const collapsed = this.state.collapsed ?? this.props.collapsed ?? false;
    const expanded = !collapsed;
    const active = 'Overzicht';
    const navItems = [
      { label: 'Overzicht', icon: 'M4 4h7v7H4zM13 4h7v4h-7zM13 12h7v8h-7zM4 15h7v5H4z' },
      { label: 'Topologie', icon: 'M9 3h6v4H9zM3 17h6v4H3zM15 17h6v4h-6zM12 7v5M6 17v-5h12v5' },
      { label: 'Apparaten', icon: 'M4 5h16v6H4zM4 13h16v6H4zM7.5 8h.01M7.5 16h.01' },
      { label: 'Clients', icon: 'M3 5h13v9H3zM7 18h5M9.5 14v4M18 9h3v10h-3z' },
      { label: 'Wifi', icon: 'M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01' },
      { label: 'Netwerken', icon: 'M12 3l9 5-9 5-9-5zM3 12.5l9 5 9-5M3 17l9 5 9-5' },
      { label: 'Onderhoud', icon: 'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z', badge: '5' },
      { label: 'Instellingen', icon: 'M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4M14 4v4M6 10v4M12 16v4' },
    ];
    const page = (() => {
      const item = (dot, title, detail, when, actions, open) => ({
        dot, title, detail, when,
        actions: (actions || []).map((label) => ({ label })),
        hasAction: !!(actions && actions.length),
        bg: open ? '#141c28' : 'transparent',
        weight: open ? 600 : 500,
      });
      return {
        items: [
          item('#e0a52e', 'RouterOS 7.20.2 voor 5 apparaten', 'Thuis. Updaten duurt ongeveer 12 minuten.', '09:00', ['Naar onderhoud'], true),
          item('#e0a52e', 'Firmware van CRS310-kantoor loopt achter', 'Thuis. Nu 7.19.4, RouterOS is 7.20.1.', '09:00', ['Updaten'], true),
          item('#5d6875', 'Ruben vernieuwde het wachtwoord van Thuis-Gast', 'Thuis. Via de app.', '11:48'),
          item('#3fb97a', 'Back-up gelukt, 2 configuraties gewijzigd', 'Thuis. 5 van 5 apparaten.', '03:00'),
          item('#f0655d', 'Rollback door veilige modus', 'Tweede locatie. Niet bevestigd binnen 2 minuten.', 'gisteren'),
          item('#3fb97a', 'Failback naar Kabel', 'Thuis. Na 35 minuten op 4G back-up.', '2 okt'),
        ],
      };
    })();
    return {
      expanded,
      sideW: expanded ? '216px' : '60px',
      sideJustify: expanded ? 'flex-start' : 'center',
      toggleIcon: expanded ? 'M4 4h16v16H4zM9 4v16M15 10l-2 2 2 2' : 'M4 4h16v16H4zM9 4v16M13 10l2 2-2 2',
      toggle: () => this.setState({ collapsed: !collapsed }),
      nav: navItems.map((n) => ({
        ...n,
        color: n.label === active ? '#ffffff' : '#b3bcc8',
        iconColor: n.label === active ? '#3d8bfd' : 'currentColor',
        bg: n.label === active ? '#1c2128' : 'transparent',
        justify: expanded ? 'flex-start' : 'center',
        showLabel: expanded,
        showBadge: expanded && !!n.badge,
        showDot: !expanded && !!n.badge,
      })),
      ...page,
    };
  }
}
</script>
</body>
</html>
