      </svg>
      <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: #5b6676; font-variant-numeric: tabular-nums">
        <span>11:30</span><span>piek 50 Mbps</span><span>17:30</span>
      </div>
    </div>
  </section>

  <section style="border-radius: 14px; background: #ffffff; border: 1px solid #e4e8ee; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">Apparaten</h2>
      <span style="font-size: 13px; color: #5b6676">5 online</span>
    </div>
    <sc-for list="{{devices}}" as="d" hint-placeholder-count="5">
      <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; min-height: 60px; padding: 8px 16px; border: 0; border-top: 1px solid #eef1f5; background: #ffffff; color: inherit; font: inherit; text-align: left; cursor: pointer">
        <span style="flex: 0 0 auto; width: 8px; height: 8px; border-radius: 4px; background: #17a65b" aria-hidden="true"></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.name}}</span>
          <span style="font-size: 12.5px; color: #5b6676">{{d.note}}</span>
        </span>
        <span style="flex: 0 0 auto; display: inline-flex; gap: 3px" aria-hidden="true">
          <sc-for list="{{d.ports}}" as="p" hint-placeholder-count="5">
            <span style="width: 9px; height: 9px; border-radius: 2px; background: {{p.c}}"></span>
          </sc-for>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b95a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </sc-for>
  </section>

  <nav aria-label="Hoofdmenu" style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 68px; box-sizing: border-box; padding: 6px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; border-radius: 22px; background: #ffffff; border: 1px solid #e4e8ee; box-shadow: 0 14px 32px rgba(16,24,40,0.14), 0 2px 6px rgba(16,24,40,0.06)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 54px; padding: 0; border: 0; border-radius: 16px; font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; color: {{t.color}}; background: {{t.bg}}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
      </button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const up = '#1fa463', poe = '#e09b00', wan = '#1668e3', off = '#cfd6df';
    const ports = (list) => list.map((c) => ({ c }));
    const tabs = [
      { label: 'Overzicht', icon: 'M4 4h7v7H4zM13 4h7v4h-7zM13 12h7v8h-7zM4 15h7v5H4z', active: true },
      { label: 'Apparaten', icon: 'M4 5h16v6H4zM4 13h16v6H4zM7.5 8h.01M7.5 16h.01' },
      { label: 'Clients', icon: 'M3 5h13v9H3zM7 18h5M9.5 14v4M18 9h3v10h-3z' },
      { label: 'Wifi', icon: 'M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01' },
      { label: 'Meer', icon: 'M5 12h.01M12 12h.01M19 12h.01M5 6h.01M12 6h.01M19 6h.01M5 18h.01M12 18h.01M19 18h.01' },
    ];
    return {
      tabs: tabs.map((t) => ({
        ...t,
        color: t.active ? '#1668e3' : '#5b6676',
        bg: t.active ? '#eaf2fe' : 'transparent',
      })),
      devices: [
        { name: 'hAP-ax2-meterkast', note: 'Router, 3 wifi-clients', ports: ports([wan, up, off, off, off]) },
        { name: 'CRS310-kantoor', note: 'Switch, 6 van 10 poorten', ports: ports([up, up, up, up, up, up, off, off, off, off]) },
        { name: 'hEX-PoE-zolder', note: 'Switch, 13,8 W PoE', ports: ports([up, poe, poe, up, up, off]) },
        { name: 'cAP-ax-woonkamer', note: 'Access point, 6 clients', ports: ports([up, off]) },
        { name: 'cAP-ax-overloop', note: 'Access point, 4 clients', ports: ports([up, off]) },
      ],
    };
  }
}
</script>
