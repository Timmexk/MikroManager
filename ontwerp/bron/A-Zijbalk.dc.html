<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Zijbalk uit- en ingeklapt, smoked glass</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 380px; height: 660px; box-sizing: border-box; padding: 20px; display: flex; justify-content: center; gap: 18px; font-family: 'Manrope', system-ui, sans-serif; font-size: 14.5px; line-height: 1.45; color: #eef3fb; background: radial-gradient(520px 420px at 10% -6%, rgba(40,110,255,0.42), transparent 62%), radial-gradient(420px 380px at 104% 70%, rgba(72,64,220,0.30), transparent 62%), #0a0f1a">

  <aside style="width: 236px; box-sizing: border-box; padding: 14px 12px; border-radius: 24px; background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.10); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); backdrop-filter: blur(22px) saturate(140%); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px">
      <span style="display: flex; gap: 3px" aria-hidden="true">
        <span style="width: 6px; height: 16px; border-radius: 2px; background: #5aa9ff"></span>
        <span style="width: 6px; height: 16px; border-radius: 2px; background: #5aa9ff"></span>
        <span style="width: 6px; height: 16px; border-radius: 2px; background: rgba(255,255,255,0.28)"></span>
      </span>
      <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em">MikroManager</span>
    </div>
    <button type="button" aria-label="Site kiezen, nu Thuis" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 8px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.10); background: rgba(0,0,0,0.22); color: inherit; font: inherit; cursor: pointer; text-align: left">
      <span style="flex: 0 0 auto; width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #06101f; background: #5aa9ff">T</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-weight: 600">Thuis</span>
        <span style="font-size: 12.5px; color: rgba(238,243,251,0.68)">5 apparaten</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"></path></svg>
    </button>
    <nav style="display: flex; flex-direction: column; gap: 4px" aria-label="Hoofdmenu uitgeklapt">
      <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
        <button type="button" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 14px; border: 0; font: inherit; font-weight: 600; cursor: pointer; text-align: left; color: {{item.color}}; background: {{item.bg}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="{{item.icon}}"></path></svg>
          <span style="flex: 1">{{item.label}}</span>
          <sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{false}}">
            <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: #1b1300; background: #ffc857">{{item.badge}}</span>
          </sc-if>
        </button>
      </sc-for>
    </nav>
    <button type="button" aria-label="Zijbalk inklappen" style="margin-top: auto; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 14px; border: 0; background: transparent; color: rgba(238,243,251,0.72); font: inherit; font-weight: 600; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM9 4v16M15 10l-2 2 2 2"></path></svg>
      <span>Inklappen</span>
    </button>
  </aside>

  <aside style="width: 70px; box-sizing: border-box; padding: 14px 12px; border-radius: 24px; background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.10); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); backdrop-filter: blur(22px) saturate(140%); display: flex; flex-direction: column; align-items: center; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: center; height: 44px">
      <span style="display: flex; gap: 3px" aria-hidden="true">
        <span style="width: 6px; height: 16px; border-radius: 2px; background: #5aa9ff"></span>
        <span style="width: 6px; height: 16px; border-radius: 2px; background: #5aa9ff"></span>
        <span style="width: 6px; height: 16px; border-radius: 2px; background: rgba(255,255,255,0.28)"></span>
      </span>
    </div>
    <button type="button" aria-label="Site kiezen, nu Thuis" style="width: 46px; height: 52px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 16px; border: 1px solid rgba(255,255,255,0.10); background: rgba(0,0,0,0.22); color: inherit; font: inherit; cursor: pointer">
      <span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #06101f; background: #5aa9ff">T</span>
    </button>
    <nav style="display: flex; flex-direction: column; gap: 4px" aria-label="Hoofdmenu ingeklapt">
      <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
        <button type="button" aria-label="{{item.label}}" style="position: relative; width: 46px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 14px; border: 0; cursor: pointer; color: {{item.color}}; background: {{item.bg}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
          <sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 4px; background: #ffc857" aria-hidden="true"></span>
          </sc-if>
        </button>
      </sc-for>
    </nav>
    <button type="button" aria-label="Zijbalk uitklappen" style="margin-top: auto; width: 46px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 14px; border: 0; background: transparent; color: rgba(238,243,251,0.72); cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM9 4v16M13 10l2 2-2 2"></path></svg>
    </button>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":380,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      { label: 'Overzicht', icon: 'M4 4h7v7H4zM13 4h7v4h-7zM13 12h7v8h-7zM4 15h7v5H4z', active: true },
      { label: 'Apparaten', icon: 'M4 5h16v6H4zM4 13h16v6H4zM7.5 8h.01M7.5 16h.01' },
      { label: 'Clients', icon: 'M3 5h13v9H3zM7 18h5M9.5 14v4M18 9h3v10h-3z' },
      { label: 'Wifi', icon: 'M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01' },
      { label: 'Netwerken', icon: 'M9 3h6v5H9zM3 16h6v5H3zM15 16h6v5h-6zM12 8v4M6 16v-4h12v4' },
      { label: 'Onderhoud', icon: 'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z', badge: '5' },
      { label: 'Instellingen', icon: 'M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4M14 4v4M6 10v4M12 16v4' },
    ];
    return {
      nav: items.map((n) => ({
        ...n,
        hasBadge: !!n.badge,
        color: n.active ? '#ffffff' : 'rgba(238,243,251,0.74)',
        bg: n.active ? 'rgba(90,169,255,0.24)' : 'transparent',
      })),
    };
  }
}
</script>
</body>
</html>
