<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>MikroManager: zes pictogrammen voor netwerkbeheer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1360px; height: 680px; box-sizing: border-box; padding: 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 20px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13.5px; line-height: 1.4; color: #e6e9ed; background: #0e1114">
  <sc-for list="{{marks}}" as="c" hint-placeholder-count="6">
    <section style="box-sizing: border-box; padding: 20px; border-radius: 6px; background: #15191e; border: 1px solid {{c.frame}}; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: #98a2af"><span>{{c.label}}</span><span style="color: #6ea8fe">{{c.tag}}</span></div>
      <div style="display: flex; align-items: center; gap: 16px">
        <span style="flex: 0 0 auto; width: 72px; height: 72px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #0a0c0f; border: 1px solid #2c343d">
          <svg width="46" height="46" viewBox="0 0 40 40" aria-hidden="true"><path d="{{c.s}}" fill="none" stroke="#c4cbd4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{c.f}}" fill="#c4cbd4"></path><path d="{{c.a}}" fill="#3d8bfd"></path></svg>
        </span>
        <div style="min-width: 0">
          <div style="font-size: 26px; line-height: 1.1; letter-spacing: -0.01em; white-space: nowrap"><span style="font-weight: 600">Mikro</span><span style="font-weight: 400; color: #98a2af">Manager</span></div>
          <div style="margin-top: 4px; color: #98a2af">Netwerkbeheer</div>
        </div>
      </div>
      <div style="color: #c4cbd4">{{c.why}}</div>
      <div style="margin-top: auto; display: flex; align-items: center; gap: 10px">
        <div style="flex: 1 1 0; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 10px; border-radius: 6px; background: #0a0c0f; border: 1px solid #242a32">
          <svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true" style="flex: 0 0 auto"><path d="{{c.s}}" fill="none" stroke="#c4cbd4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{c.f}}" fill="#c4cbd4"></path><path d="{{c.a}}" fill="#3d8bfd"></path></svg>
          <span style="font-size: 15px; font-weight: 600; white-space: nowrap">MikroManager</span>
        </div>
        <div style="flex: 0 0 48px; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #0a0c0f; border: 1px solid #242a32">
          <svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true"><path d="{{c.s}}" fill="none" stroke="#c4cbd4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{c.f}}" fill="#c4cbd4"></path><path d="{{c.a}}" fill="#3d8bfd"></path></svg>
        </div>
        <div style="flex: 0 0 48px; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #ffffff; border: 1px solid #dfe3e8">
          <svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true"><path d="{{c.s}}" fill="none" stroke="#333b45" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{c.f}}" fill="#333b45"></path><path d="{{c.a}}" fill="#1a66d9"></path></svg>
        </div>
        <div style="flex: 0 0 22px; height: 22px; display: flex; align-items: center; justify-content: center" title="Op tabbladformaat">
          <svg width="16" height="16" viewBox="0 0 40 40" aria-hidden="true"><path d="{{c.s}}" fill="none" stroke="#c4cbd4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{c.f}}" fill="#c4cbd4"></path><path d="{{c.a}}" fill="#3d8bfd"></path></svg>
        </div>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":680}}'>
// Each mark: s = neutral line work, f = neutral solid shapes, a = the one blue accent.
const dot = (cx, cy, r) => `M${cx} ${cy - r}a${r} ${r} 0 1 0 0 ${2 * r}a${r} ${r} 0 1 0 0 ${-2 * r}z`;
class Component extends DCLogic {
  renderVals() {
    const marks = [
      { label: 'Knooppunten 1: de M als netwerk', tag: '',
        why: 'Vijf apparaten, verbonden in de vorm van een M. Het middelste punt is de beheerder.',
        s: 'M7 31V9l13 13 13-13v22',
        f: dot(7, 9, 3.6) + dot(33, 9, 3.6) + dot(7, 31, 3.6) + dot(33, 31, 3.6),
        a: dot(20, 22, 4.6) },
      { label: 'Knooppunten 2: boomstructuur', tag: '',
        why: 'De router bovenaan, drie apparaten eronder. Leest meteen als een netwerk.',
        s: 'M20 13v8M8 27v-6h24v6M20 21v6',
        f: 'M4.5 27h7v7h-7zM16.5 27h7v7h-7zM28.5 27h7v7h-7z',
        a: 'M15 4h10v9H15z' },
      { label: 'Switch 1: kastje met poorten', tag: 'staat nu in de voorbeelden', picked: true,
        why: 'Het frontje van een switch met vier poorten, waarvan één in gebruik.',
        s: 'M6 11h28a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3z',
        f: 'M7 17h5v6H7zM14 17h5v6h-5zM28 17h5v6h-5z',
        a: 'M21 17h5v6h-5z' },
      { label: 'Switch 2: twee apparaten in een rack', tag: '',
        why: 'Twee apparaten boven elkaar: je beheert er meer dan één.',
        s: 'M4 7h32v11H4zM4 22h32v11H4z',
        f: 'M8 10.5h4v4H8zM14 10.5h4v4h-4zM8 25.5h4v4H8zM14 25.5h4v4h-4zM20 25.5h4v4h-4z',
        a: 'M27 10.5h5v4h-5z' },
      { label: 'Router 1: kastje met wifi', tag: '',
        why: 'Een router met golven erboven: bedraad en draadloos in één beeld.',
        s: 'M10 13a14 14 0 0 1 20 0M14.5 17.5a7.5 7.5 0 0 1 11 0M5 25h30v9H5z',
        f: 'M9 28.5h3v2H9zM14 28.5h3v2h-3z',
        a: 'M18.5 19.5h3v5.5h-3zM27 28h4v3h-4z' },
      { label: 'Router 2: wifi boven het bekabelde net', tag: '',
        why: 'Een access point met daaronder de kabels naar twee apparaten.',
        s: 'M9 12a15.5 15.5 0 0 1 22 0M13.5 16.5a9 9 0 0 1 13 0M20 24v5M8 33v-4h24v4',
        f: 'M5 32h6v6H5zM29 32h6v6h-6z',
        a: dot(20, 21.5, 3.2) },
    ];
    return { marks: marks.map((m) => ({ ...m, frame: m.picked ? '#3d8bfd' : '#242a32' })) };
  }
}
</script>
</body>
</html>
