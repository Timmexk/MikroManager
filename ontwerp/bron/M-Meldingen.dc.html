<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Mobiel: meldingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#6ea8fe}a:hover{color:#a9cbff}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 16px 14px 0; display: flex; flex-direction: column; gap: 12px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13.5px; line-height: 1.4; color: #e6e9ed; background: #0e1114">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="#terug" aria-label="Terug" style="flex: 0 0 auto; width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #242a32; background: #15191e; color: #c4cbd4; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Meldingen</h1>
      <div style="font-size: 12.5px; color: #98a2af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">2 vragen aandacht</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: 6px; border: 1px solid #242a32; overflow: hidden">
    <button type="button" aria-pressed="true" style="height: 40px; padding: 0; border: 0; background: #242a32; color: #ffffff; font: inherit; font-weight: 600; cursor: pointer">Thuis</button>
    <button type="button" aria-pressed="false" style="height: 40px; padding: 0; border: 0; border-left: 1px solid #242a32; background: #15191e; color: #98a2af; font: inherit; cursor: pointer">Alle sites</button>
    <button type="button" aria-pressed="false" style="height: 40px; padding: 0; border: 0; border-left: 1px solid #242a32; background: #15191e; color: #98a2af; font: inherit; cursor: pointer">Instellen</button>
  </div>

  <section style="border-radius: 6px; background: #15191e; border: 1px solid #242a32; overflow: hidden">
    <sc-for list="{{items}}" as="m" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #1c2229; background: {{m.bg}}">
        <span style="margin-top: 6px; width: 8px; height: 8px; background: {{m.dot}}" aria-hidden="true"></span>
        <div style="min-width: 0">
          <div style="font-weight: {{m.weight}}">{{m.title}}</div>
          <div style="font-size: 12.5px; color: #98a2af">{{m.detail}}</div>
          <sc-if value="{{m.hasAction}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; gap: 8px; margin-top: 9px">
              <sc-for list="{{m.actions}}" as="a" hint-placeholder-count="2">
                <button type="button" style="height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #2c343d; background: #111519; color: #e6e9ed; font: inherit; font-weight: 500; cursor: pointer">{{a.label}}</button>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <span style="font-size: 12.5px; color: #98a2af; white-space: nowrap">{{m.when}}</span>
      </div>
    </sc-for>
  </section>
  <nav aria-label="Hoofdmenu" style="position: absolute; left: 14px; right: 14px; bottom: 16px; height: 64px; box-sizing: border-box; padding: 5px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; border-radius: 12px; background: #1a1f25; border: 1px solid #333b45; box-shadow: 0 16px 36px rgba(0,0,0,0.6)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; padding: 0; border: 0; border-radius: 8px; font: inherit; font-size: 11px; font-weight: 500; cursor: pointer; color: {{t.color}}; background: {{t.bg}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.iconColor}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
      </button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const active = 'geen';
    const tabs = [
      { label: 'Overzicht', icon: 'M4 4h7v7H4zM13 4h7v4h-7zM13 12h7v8h-7zM4 15h7v5H4z' },
      { label: 'Apparaten', icon: 'M4 5h16v6H4zM4 13h16v6H4zM7.5 8h.01M7.5 16h.01' },
      { label: 'Clients', icon: 'M3 5h13v9H3zM7 18h5M9.5 14v4M18 9h3v10h-3z' },
      { label: 'Wifi', icon: 'M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01' },
      { label: 'Meer', icon: 'M5 12h.01M12 12h.01M19 12h.01M5 6h.01M12 6h.01M19 6h.01M5 18h.01M12 18h.01M19 18h.01' },
    ];
    const page = (() => {
      const item = (dot, title, detail, when, actions, open) => ({
        dot, title, detail, when,
        actions: (actions || []).map((label) => ({ label })),
        hasAction: !!(actions && actions.length),
        bg: open ? '#141c28' : 'transparent',
        weight: open ? 600 : 500,
      });
      return {
        items: [
          item('#e0a52e', 'RouterOS 7.20.2 voor 5 apparaten', 'Updaten duurt ongeveer 12 minuten', '09:00', ['Naar onderhoud'], true),
          item('#e0a52e', 'Firmware van CRS310-kantoor loopt achter', 'Nu 7.19.4, RouterOS is 7.20.1', '09:00', ['Updaten'], true),
          item('#5d6875', 'Ruben vernieuwde het wachtwoord van Thuis-Gast', 'Via de app', '11:48'),
          item('#3fb97a', 'Back-up gelukt, 2 configuraties gewijzigd', '5 van 5 apparaten', '03:00'),
          item('#3fb97a', 'Failback naar Kabel', 'Na 35 minuten op 4G back-up', '2 okt'),
        ],
      };
    })();
    return {
      tabs: tabs.map((t) => ({
        ...t,
        color: t.label === active ? '#ffffff' : '#98a2af',
        iconColor: t.label === active ? '#3d8bfd' : 'currentColor',
        bg: t.label === active ? '#262d36' : 'transparent',
      })),
      ...page,
    };
  }
}
</script>
</body>
</html>
